name: Deploy to MonsterASP.net

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: src/Frontend/package-lock.json

    - name: Build React Frontend
      run: |
        cd src/Frontend
        npm install
        npm run build

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Run Automated Regression & Security Tests
      run: |
        dotnet test S7JobSeeker.sln --configuration Release --verbosity normal

    - name: Publish .NET Web API
      run: |
        dotnet publish src/Backend/S7JobSeeker.Api/S7JobSeeker.Api.csproj -c Release -o ./publish
        cp -r src/Backend/S7JobSeeker.Api/wwwroot/* ./publish/

    - name: Prepare app_offline marker
      run: |
        mkdir -p ./take_offline
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Deploying</title></head><body><h3>Application is updating... Please wait.</h3></body></html>' > ./take_offline/app_offline.htm

    - name: Take IIS App Offline (Release DLL Locks)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.MONSTERASP_FTP_SERVER }}
        username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
        password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        local-dir: ./take_offline/
        server-dir: wwwroot/
        protocol: ftps

    - name: Deploy Published Files to MonsterASP wwwroot via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.MONSTERASP_FTP_SERVER }}
        username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
        password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: wwwroot/
        protocol: ftps

    - name: Bring IIS App Online (Remove app_offline)
      run: |
        curl -k --ftp-ssl "ftp://${{ secrets.MONSTERASP_FTP_SERVER }}/wwwroot/" -u "${{ secrets.MONSTERASP_FTP_USERNAME }}:${{ secrets.MONSTERASP_FTP_PASSWORD }}" -Q "-DELE app_offline.htm" -Q "-DELE wwwroot/app_offline.htm" || true
